site_name: Studio API Documentation
site_description: Studio API Complete Documentation - WebSocket and HTTP API Guide
site_author: Studio API Team
site_url: https://ikigai-kevin-k.github.io/studio-api-mirror/

repo_name: studio-api-mirror
repo_url: https://github.com/ikigai-kevin-k/studio-api-mirror
edit_uri: edit/main/docs/docs/

theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: 繁體中文
      link: /
      lang: zh-TW

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - en
        - zh-TW
  - mermaid2

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Documentation:
    - Overview: api/overview.md
    - Authentication: api/authentication.md
    - HTTP API:
      - Device Management: api/http/device.md
      - Status Management: api/http/status.md
    - WebSocket API:
      - Connection Setup: api/websocket/connection.md
      - Device Registration: api/websocket/device-registration.md
      - Status Update: api/websocket/status-update.md
      - Error Signal: api/websocket/error-signal.md
  - Examples:
    - JavaScript/TypeScript: examples/javascript.md
    - Python: examples/python.md
    - cURL: examples/curl.md
  - Reference:
    - Error Codes: reference/error-codes.md
    - Error Signals: reference/error-signals.md
    - Status Enums: reference/status-enums.md
    - WebSocket Events: reference/websocket-events.md
  - English:
    - Home: en/index.md
    - Getting Started: en/getting-started.md
    - API Documentation:
      - Overview: en/api/overview.md
      - Authentication: en/api/authentication.md
